<script>
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let modoAuth = 'login';
        let listaGlobalCartoes = [];
        let itemSendoEditado = { id: null, tipoTabela: '' };
        let itemSendoExcluido = { id: null, parentId: null, tagGrupo: null, tipo: null };
        
        let usuarioLogado = null; 

        const hoje = new Date();
        const mesAtualStr = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');

        async function inicializarApp() {
            const filtroInput = document.getElementById('filtro-periodo');
            if (filtroInput) {
                filtroInput.value = mesAtualStr;
            }

            const { data: { session } } = await _supabase.auth.getSession();
            if (session && session.user) {
                usuarioLogado = session.user;
                mostrarDashboard();
                buscarNomeUsuario(usuarioLogado.id);
                await carregarOpcoesCartoes();
                await atualizarTudo();
            } else {
                mostrarLogin();
            }
        }

        _supabase.auth.onAuthStateChange(async (event, session) => {
            if (session && session.user) {
                usuarioLogado = session.user;
                mostrarDashboard();
                buscarNomeUsuario(usuarioLogado.id);
                await carregarOpcoesCartoes();
                await atualizarTudo();
            } else {
                usuarioLogado = null;
                mostrarLogin();
            }
        });

        window.addEventListener('DOMContentLoaded', inicializarApp);

        function obterPeriodoSelecionado() {
            const filtroInput = document.getElementById('filtro-periodo');
            if (filtroInput && filtroInput.value) {
                return filtroInput.value;
            }
            return mesAtualStr;
        }

        function ajustarCamposReceita() {
            const tipo = document.getElementById('rec-tipo').value;
            const wrapper = document.getElementById('wrapper-meses-receita');
            if (tipo === 'recorrente') wrapper.classList.remove('hidden');
            else wrapper.classList.add('hidden');
        }

        function ajustarCamposDespesa() {
            const tipo = document.getElementById('des-tipo').value;
            const forma = document.getElementById('des-forma').value;
            const wrapperAvancado = document.getElementById('wrapper-opcoes-avancadas');
            const wrapperCartao = document.getElementById('wrapper-cartao');
            const wrapperParcelasInput = document.getElementById('wrapper-parcelas-input');

            if (tipo === 'fixa') {
                wrapperAvancado.classList.remove('hidden');
                wrapperParcelasInput.classList.add('hidden');
                if (forma === 'credito') wrapperCartao.classList.remove('hidden');
                else wrapperCartao.classList.add('hidden');
            } else {
                wrapperParcelasInput.classList.remove('hidden');
                if (forma === 'credito' || forma === 'empresa_parcelado') {
                    wrapperAvancado.classList.remove('hidden');
                    if (forma === 'empresa_parcelado') wrapperCartao.classList.add('hidden');
                    else wrapperCartao.classList.remove('hidden');
                } else {
                    wrapperAvancado.classList.add('hidden');
                }
            }
        }

        async function carregarOpcoesCartoes() {
            try {
                const { data, error } = await _supabase.from('cartoes').select('*').order('nome', {ascending: true});
                if (error) throw error;
                listaGlobalCartoes = data || [];
                const select = document.getElementById('des-cartao');
                const listaDiv = document.getElementById('lista-cartoes');
                if (!select) return;
                select.innerHTML = '<option value="">Selecione o Cartão...</option>';
                listaDiv.innerHTML = '';
                listaGlobalCartoes.forEach(c => {
                    select.innerHTML += `<option value="${c.id}">${c.nome} (Venc. dia ${c.dia_vencimento})</option>`;
                    listaDiv.innerHTML += `<div class="py-1.5 flex justify-between text-xs"><span>💳 ${c.nome}</span><span class="text-slate-500">Venc. dia ${c.dia_vencimento}</span></div>`;
                });
            } catch (err) { console.error(err); }
        }

        async function salvarCartao(event) {
            event.preventDefault();
            if (!usuarioLogado) return;
            const dados = {
                user_id: usuarioLogado.id,
                nome: document.getElementById('cartao-nome').value,
                dia_vencimento: parseInt(document.getElementById('cartao-vencimento').value)
            };
            await _supabase.from('cartoes').insert([dados]);
            document.getElementById('form-cartao').reset();
            await carregarOpcoesCartoes();
        }

        async function salvarReceita(event) {
            event.preventDefault();
            if (!usuarioLogado) return;
            try {
                const tipo = document.getElementById('rec-tipo').value;
                const qtdMeses = tipo === 'recorrente' ? parseInt(document.getElementById('rec-meses').value || 1) : 1;
                const valorInformado = parseFloat(document.getElementById('rec-valor').value);
                const desc = document.getElementById('rec-desc').value;
                const cat = document.getElementById('rec-cat').value;
                
                const periodoInicial = obterPeriodoSelecionado();
                let [ano, mes] = periodoInicial.split('-').map(Number);

                const tokenLote = tipo === 'recorrente' ? `LOTE-${Math.floor(Date.now()/1000)}` : '';

                const receitasInserir = [];
                for (let i = 1; i <= qtdMeses; i++) {
                    let mesString = String(mes).padStart(2, '0');
                    let periodoParcela = `${ano}-${mesString}`;
                    
                    let descricaoFinal = tipo === 'recorrente' ? `${desc} (${i}/${qtdMeses}) [${tokenLote}]` : desc;

                    receitasInserir.push({
                        user_id: usuarioLogado.id,
                        descricao: descricaoFinal,
                        valor: valorInformado,
                        categoria: cat,
                        periodo: periodoParcela
                    });

                    mes++;
                    if (mes > 12) { mes = 1; ano++; }
                }

                const { error } = await _supabase.from('receitas').insert(receitasInserir);
                if (error) throw error;

                document.getElementById('form-receita').reset();
                ajustarCamposReceita();
                await atualizarTudo();
            } catch (err) {
                alert("Erro ao salvar receita: " + err.message);
            }
        }

        async function salvarDespesa(event) {
            event.preventDefault();
            if (!usuarioLogado) return;
            const tipo = document.getElementById('des-tipo').value;
            const formaPagamento = document.getElementById('des-forma').value;
            const totalParcelas = tipo === 'fixa' ? 12 : parseInt(document.getElementById('des-parcelas').value || 1);
            const valorInformado = parseFloat(document.getElementById('des-valor').value);
            const cartaoId = formaPagamento === 'credito' ? document.getElementById('des-cartao').value : null;
            
            if (formaPagamento === 'credito' && !cartaoId) {
                alert("Por favor, selecione um cartão de crédito.");
                return;
            }

            const despesaBase = {
                user_id: usuarioLogado.id,
                descricao: document.getElementById('des-desc').value,
                categoria: document.getElementById('des-cat').value,
                tipo: tipo,
                forma_pagamento: formaPagamento,
                cartao_id: cartaoId,
                total_parcelas: totalParcelas
            };

            const { data: despesaSalva, error } = await _supabase.from('despesas').insert([despesaBase]).select().single();
            if (error) return alert("Erro ao salvar despesa: " + error.message);

            const periodoInicial = obterPeriodoSelecionado();
            await gerarParcelasBanco(despesaSalva.id, usuarioLogado.id, totalParcelas, valorInformado, formaPagamento, cartaoId, periodoInicial, 1);
            
            document.getElementById('form-despesa').reset();
            ajustarCamposDespesa();
            await atualizarTudo();
        }

        async function gerarParcelasBanco(despesaId, userId, qtdMeses, valor, formaPagamento, cartaoId, periodoPartida, numeroParcelaInicial = 1) {
            const parcelasParaInserir = [];
            let [ano, mes] = periodoPartida.split('-').map(Number);

            let diaVencimento = 5; 
            if (formaPagamento === 'credito' && cartaoId) {
                const c = listaGlobalCartoes.find(item => item.id === cartaoId);
                if (c) diaVencimento = c.dia_vencimento;
            } else if (formaPagamento === 'dinheiro_pix') {
                diaVencimento = hoje.getDate();
            }

            let contadorParcela = numeroParcelaInicial;
            for (let i = 1; i <= qtdMeses; i++) {
                let mesString = String(mes).padStart(2, '0');
                let periodoParcela = `${ano}-${mesString}`;
                let dataVenc = `${ano}-${mesString}-${String(diaVencimento).padStart(2, '0')}`;

                parcelasParaInserir.push({
                    despesa_id: despesaId,
                    user_id: userId,
                    numero_parcela: contadorParcela,
                    valor: valor,
                    periodo: periodoParcela,
                    data_vencimento: dataVenc
                });

                contadorParcela++;
                mes++;
                if (mes > 12) { mes = 1; ano++; }
            }
            await _supabase.from('parcelas_despesas').insert(parcelasParaInserir);
        }

        function abrirModalEdicao(id, valorAtual, tipoTabela) {
            itemSendoEditado.id = id;
            itemSendoEditado.tipoTabela = tipoTabela;
            
            const modal = document.getElementById('custom-modal-edit');
            const input = document.getElementById('modal-edit-input');
            const titulo = document.getElementById('modal-edit-titulo');
            const icone = document.getElementById('modal-edit-icon');
            
            input.value = valorAtual;
            
            if (tipoTabela === 'receitas') {
                titulo.innerText = "Editar Valor da Receita";
                icone.innerText = "📈";
                icone.className = "bg-emerald-500/10 p-2.5 rounded-xl text-emerald-400";
            } else {
                titulo.innerText = "Editar Valor da Saída";
                icone.innerText = "✏️";
                icone.className = "bg-indigo-500/10 p-2.5 rounded-xl text-indigo-400";
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.firstElementChild.classList.remove('scale-95');
            }, 10);

            document.getElementById('modal-edit-btn-salvar').onclick = async function() {
                const novoValor = parseFloat(input.value);
                if (isNaN(novoValor) || novoValor <= 0) return alert("Insira um valor válido.");
                
                const { error } = await _supabase.from(itemSendoEditado.tipoTabela).update({ valor: novoValor }).eq('id', itemSendoEditado.id);
                if (error) alert("Falha na atualização: " + error.message);
                else {
                    fecharModalEdicao();
                    await atualizarTudo();
                }
            };
        }

        function fecharModalEdicao() {
            const modal = document.getElementById('custom-modal-edit');
            modal.classList.add('opacity-0');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
            itemSendoEditado = { id: null, tipoTabela: '' };
        }

        async function renovarDespesaFixa(despesaId, ultimaParcelaNum, ultimoPeriodo, valor, forma, cartaoId) {
            if (!confirm("Deseja renovar essa despesa fixa por mais 12 meses?")) return;
            if (!usuarioLogado) return;
            
            let [ano, mes] = ultimoPeriodo.split('-').map(Number);
            mes++;
            if (mes > 12) { mes = 1; ano++; }
            const proximoPeriodo = `${ano}-${String(mes).padStart(2, '0')}`;

            const novoTotal = parseInt(ultimaParcelaNum) + 12;
            await _supabase.from('despesas').update({ total_parcelas: novoTotal }).eq('id', despesaId);
            await gerarParcelasBanco(despesaId, usuarioLogado.id, 12, parseFloat(valor), forma, cartaoId, proximoPeriodo, parseInt(ultimaParcelaNum) + 1);
            
            alert("Despesa fixa estendida com sucesso por mais 12 meses!");
            await atualizarTudo();
        }

        // CORREÇÃO: Identifica inteligentemente se é recorrente ou registro único
        function tentarExcluirItem(id, parentId, tagGrupo, tipo, totalParcelas = 1) {
            itemSendoExcluido = { id, parentId, tagGrupo, tipo };

            // Se for receita única ou despesa de parcela única, não abre o modal de escolhas
            if (tipo === 'receita_unica' || (tipo === 'despesa' && parseInt(totalParcelas || 1) <= 1)) {
                if (confirm("Tem certeza que deseja excluir esta movimentação?")) {
                    executarExclusaoDefinitiva(false);
                }
                return;
            }

            // Abre o modal de múltiplas escolhas apenas para despesas/receitas recorrentes
            const modal = document.getElementById('custom-modal-delete');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.firstElementChild.classList.remove('scale-95');
            }, 10);
        }

        function fecharModalExclusao() {
            const modal = document.getElementById('custom-modal-delete');
            modal.classList.add('opacity-0');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        async function ejecutarExclusaoDefinitiva(apagarTudo) {
            fecharModalExclusao();
            try {
                if (itemSendoExcluido.tipo === 'receita_unica' || itemSendoExcluido.tipo === 'receita_recorrente') {
                    if (apagarTudo && itemSendoExcluido.tagGrupo) {
                        await _supabase.from('receitas').delete().like('descricao', `%[${itemSendoExcluido.tagGrupo}]%`);
                    } else {
                        await _supabase.from('receitas').delete().eq('id', itemSendoExcluido.id);
                    }
                } else {
                    if (apagarTudo && itemSendoExcluido.parentId) {
                        await _supabase.from('parcelas_despesas').delete().eq('despesa_id', itemSendoExcluido.parentId);
                        await _supabase.from('despesas').delete().eq('id', itemSendoExcluido.parentId);
                    } else {
                        await _supabase.from('parcelas_despesas').delete().eq('id', itemSendoExcluido.id);
                    }
                }
            } catch (err) {
                console.error("Erro ao processar exclusão:", err);
            } finally {
                await atualizarTudo();
            }
        }

        document.getElementById('btn-delete-only').onclick = () => ejecutarExclusaoDefinitiva(false);
        document.getElementById('btn-delete-all').onclick = () => ejecutarExclusaoDefinitiva(true);

        async function atualizarTudo() {
            if (!usuarioLogado) return;
            const periodo = obterPeriodoSelecionado();

            const { data: receitas } = await _supabase.from('receitas')
                .select('*')
                .eq('periodo', periodo)
                .eq('user_id', usuarioLogado.id);
                
            let tReceitas = 0;
            const containerReceitas = document.getElementById('container-lista-receitas');
            containerReceitas.innerHTML = '';
            
            (receitas || []).forEach(r => {
                const valor = parseFloat(r.valor);
                tReceitas += valor;
                
                const matchLote = r.descricao.match(/\[(LOTE-\d+)\]/);
                const tagGrupoLimpa = matchLote ? matchLote[1] : '';
                const tipoRec = tagGrupoLimpa ? 'receita_recorrente' : 'receita_unica';
                
                let descricaoExibicao = r.descricao.replace(/\s*\[LOTE-\d+\]/, '').trim();
                
                containerReceitas.innerHTML += `
                    <div class="bg-slate-900/40 md:bg-transparent border border-slate-800/60 md:border-none rounded-xl p-3 md:p-0 md:py-3 flex flex-col md:flex-row justify-between md:items-center gap-2 md:gap-4 border-b md:border-b border-slate-800/40">
                        <div class="flex-1">
                            <span class="font-semibold text-slate-100 text-sm md:text-xs">${descricaoExibicao}</span>
                            <span class="text-[11px] text-slate-500 block mt-0.5">Categoria: ${r.categoria}</span>
                        </div>
                        <div class="flex md:flex-col items-center md:items-end justify-between md:justify-center gap-1.5 pt-2 md:pt-0 border-t border-slate-800/30 md:border-none">
                            <span class="font-bold text-emerald-400 text-sm md:text-xs">+ R$ ${valor.toFixed(2)}</span>
                            <div class="flex gap-3 text-xs md:text-[10px] font-medium">
                                <button onclick="abrirModalEdicao('${r.id}', ${valor}, 'receitas')" class="text-indigo-400 hover:text-indigo-300 py-1">Editar R$</button>
                                <button onclick="tentarExcluirItem('${r.id}', null, '${tagGrupoLimpa}', '${tipoRec}', 1)" class="text-rose-500 hover:text-rose-400 py-1">Excluir</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            const { data: parcelas } = await _supabase.from('parcelas_despesas')
                .select('*, despesas(*)')
                .eq('periodo', periodo)
                .eq('user_id', usuarioLogado.id);
                
            let tFixas = 0;
            let tVariaveis = 0;
            const containerSaidas = document.getElementById('container-lista-despesas');
            containerSaidas.innerHTML = '';

            if (parcelas) {
                for (const p of parcelas) {
                    if (!p.despesas) continue;
                    const valor = parseFloat(p.valor);
                    
                    if (p.despesas.tipo === 'fixa') tFixas += valor;
                    else tVariaveis += valor;

                    let eUltimoMes = false;
                    if (p.despesas.tipo === 'fixa') {
                        const { data: tParcelas } = await _supabase.from('parcelas_despesas')
                            .select('periodo')
                            .eq('despesa_id', p.despesa_id)
                            .order('periodo', { ascending: false })
                            .limit(1);
                        
                        if (tParcelas && tParcelas[0]?.periodo === periodo) eUltimoMes = true;
                    }

                    exibirLinhaDespesaMobileFriendly(containerSaidas, p, p.despesas, eUltimoMes);
                }
            }

            document.getElementById('card-receitas').innerText = `R$ ${tReceitas.toFixed(2)}`;
            document.getElementById('card-fixas').innerText = `R$ ${tFixas.toFixed(2)}`;
            document.getElementById('card-variaveis').innerText = `R$ ${tVariaveis.toFixed(2)}`;
            
            const saldoGeral = tReceitas - (tFixas + tVariaveis);
            const cardSaldo = document.getElementById('card-saldo');
            cardSaldo.innerText = `R$ ${saldoGeral.toFixed(2)}`;
            cardSaldo.className = `text-lg md:text-2xl font-bold mt-1 md:mt-2 ${saldoGeral < 0 ? 'text-rose-400' : 'text-emerald-400'}`;
        }

        function exibirLinhaDespesaMobileFriendly(container, parcela, despesa, eUltimoMes) {
            const sufixoDesc = despesa.tipo === 'fixa' ? ' 🔄' : ` (${parcela.numero_parcela}/${despesa.total_parcelas})`;
            const badgeCor = despesa.tipo === 'fixa' ? 'text-amber-400 border-amber-500/30 bg-amber-500/5' : 'text-rose-400 border-rose-500/30 bg-rose-500/5';
            
            let infoPgto = '💵 PIX/Débito';
            let sufixoDataTexto = 'Lançado em';
            
            if (despesa.forma_pagamento === 'credito') {
                infoPgto = '💳 Crédito';
                sufixoDataTexto = 'Vencimento em';
            } else if (despesa.forma_pagamento === 'empresa_parcelado') {
                infoPgto = '🏢 Empresa';
                sufixoDataTexto = 'Vencimento em';
            }

            const dataBR = parcela.data_vencimento.split('-').reverse().join('/');

            let alertaRenovacaoHtml = '';
            if (eUltimoMes) {
                alertaRenovacaoHtml = `
                    <div class="mt-2 flex items-center gap-2 bg-amber-500/10 border border-amber-500/20 p-2 rounded-xl">
                        <span class="text-amber-400 text-[10px] font-bold tracking-tight">⚠️ ÚLTIMO MÊS</span>
                        <button onclick="renovarDespesaFixa('${despesa.id}', '${parcela.numero_parcela}', '${parcela.periodo}', ${parcela.valor}, '${despesa.forma_pagamento}', '${despesa.cartao_id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] px-2 py-1 rounded-md font-bold transition-all ml-auto">
                            Renovar 12 Meses
                        </button>
                    </div>
                `;
            }

            container.innerHTML += `
                <div class="bg-slate-900/40 md:bg-transparent border border-slate-800/60 md:border-none rounded-xl p-3 md:p-0 md:py-3 flex flex-col md:flex-row justify-between md:items-center gap-2 md:gap-4 border-b md:border-b border-slate-800/40">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-slate-100 text-sm md:text-xs">${despesa.descricao}${sufixoDesc}</span>
                            <span class="border px-1.5 py-0.5 text-[9px] rounded font-semibold tracking-wider ${badgeCor}">${despesa.tipo.toUpperCase()}</span>
                        </div>
                        <span class="text-[11px] text-slate-500 block mt-0.5">${infoPgto} • ${sufixoDataTexto} ${dataBR}</span>
                        ${alertaRenovacaoHtml}
                    </div>
                    <div class="flex md:flex-col items-center md:items-end justify-between md:justify-center gap-1.5 pt-2 md:pt-0 border-t border-slate-800/30 md:border-none">
                        <span class="font-bold text-rose-400 text-sm md:text-xs">- R$ ${parseFloat(parcela.valor).toFixed(2)}</span>
                        <div class="flex gap-3 text-xs md:text-[10px] font-medium">
                            <button onclick="abrirModalEdicao('${parcela.id}', ${parcela.valor}, 'parcelas_despesas')" class="text-indigo-400 hover:text-indigo-300 py-1">Editar R$</button>
                            <button onclick="tentarExcluirItem('${parcela.id}', '${despesa.id}', null, 'despesa', ${despesa.total_parcelas || 1})" class="text-rose-500 hover:text-rose-400 py-1">Excluir</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function mudarAbaAuth(modo) {
            modoAuth = modo;
            document.getElementById('campos-cadastro').className = modo === 'cadastro' ? 'grid grid-cols-2 gap-3' : 'hidden';
            document.getElementById('btn-auth-submit').innerText = modo === 'cadastro' ? 'Criar Conta' : 'Entrar';
            document.getElementById('btn-aba-login').className = modo === 'login' ? "w-1/2 pb-3 text-center border-b-2 border-indigo-500 font-medium text-sm text-slate-100" : "w-1/2 pb-3 text-center border-b-2 border-transparent font-medium text-sm text-slate-400";
            document.getElementById('btn-aba-cadastro').className = modo === 'cadastro' ? "w-1/2 pb-3 text-center border-b-2 border-indigo-500 font-medium text-sm text-slate-100" : "w-1/2 pb-3 text-center border-b-2 border-transparent font-medium text-sm text-slate-400";
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            if (modoAuth === 'login') {
                const { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert("Erro ao fazer login: " + error.message);
            } else {
                const nome = document.getElementById('auth-nome').value.trim();
                const sobrenome = document.getElementById('auth-sobrenome').value.trim();
                if(!nome || !sobrenome) return alert("Preencha o nome completo.");
                const { data, error } = await _supabase.auth.signUp({ email, password, options: { data: { full_name: `${nome} ${sobrenome}` } } });
                if (error) alert(error.message);
                else {
                    if(data?.user) await _supabase.from('usuarios').insert([{ id: data.user.id, nome: `${nome} ${sobrenome}` }]);
                    alert("Conta criada!");
                    mudarAbaAuth('login');
                }
            }
        }

        async function logout() {
            try { 
                await _supabase.auth.signOut(); 
            } catch(e) {
                console.warn("SignOut nativo.");
            } finally {
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('sb-')) localStorage.removeItem(key);
                }
                window.location.reload();
            }
        }
        
        function mostrarDashboard() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-dashboard').classList.remove('hidden');
            document.body.className = "bg-gradient-to-tr from-slate-950 via-slate-900 to-slate-950 min-h-screen text-slate-100 font-sans flex items-start justify-center p-3 md:p-8";
        }
        function mostrarLogin() {
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('app-dashboard').classList.add('hidden');
            document.body.className = "bg-gradient-to-tr from-slate-900 via-slate-800 to-indigo-950 min-h-screen text-slate-100 font-sans flex items-center justify-center p-4";
        }
        async function buscarNomeUsuario(userId) {
            const { data } = await _supabase.from('usuarios').select('nome').eq('id', userId).single();
            if (data) document.getElementById('user-display-name').innerText = data.nome;
        }
    </script>
